<form id="accommodation-form" class="space-y-4">
    <div>
        <label class="block text-xs uppercase tracking-wider text-neutral-300 mb-1 font-mono font-semibold">Student Name</label>
        <input type="text" id="student_name" required class="w-full bg-darkbg border border-mutedborder rounded-lg px-3 py-2 text-white text-xs focus:outline-none focus:border-accentglow transition" placeholder="Full name">
    </div>
    <div>
        <label class="block text-xs uppercase tracking-wider text-neutral-300 mb-1 font-mono font-semibold">Facility / Address</label>
        <input type="text" id="address" required class="w-full bg-darkbg border border-mutedborder rounded-lg px-3 py-2 text-white text-xs focus:outline-none focus:border-accentglow transition" placeholder="Room / Unit ID">
    </div>
    <div class="grid grid-cols-2 gap-2">
        <div>
            <label class="block text-xs uppercase tracking-wider text-neutral-300 mb-1 font-mono font-semibold">Start Date</label>
            <input type="date" id="start_date" required class="w-full bg-darkbg border border-mutedborder rounded-lg px-2 py-2 text-white text-xs focus:outline-none focus:border-accentglow transition">
        </div>
        <div>
            <label class="block text-xs uppercase tracking-wider text-neutral-300 mb-1 font-mono font-semibold">End Date</label>
            <input type="date" id="end_date" required class="w-full bg-darkbg border border-mutedborder rounded-lg px-2 py-2 text-white text-xs focus:outline-none focus:border-accentglow transition">
        </div>
    </div>
    <div class="grid grid-cols-2 gap-2">
        <div>
            <label class="block text-xs uppercase tracking-wider text-neutral-300 mb-1 font-mono font-semibold">Status</label>
            <select id="status" class="w-full bg-darkbg border border-mutedborder rounded-lg px-2 py-2 text-white text-xs focus:outline-none focus:border-accentglow transition font-mono">
                <option>Active</option>
                <option>Pending</option>
                <option>Checked-Out</option>
            </select>
        </div>
        <div>
            <label class="block text-xs uppercase tracking-wider text-neutral-300 mb-1 font-mono font-semibold">Payment</label>
            <select id="payment_status" class="w-full bg-darkbg border border-mutedborder rounded-lg px-2 py-2 text-white text-xs focus:outline-none focus:border-accentglow transition font-mono">
                <option>Paid</option>
                <option>Pending</option>
                <option>Exempt</option>
            </select>
        </div>
    </div>
    <button type="submit" class="w-full bg-gradient-to-r from-accentglow to-cyan-400 text-black py-3 font-black uppercase tracking-wider rounded-lg shadow-[0_0_15px_rgba(0,242,254,0.3)] hover:opacity-90 transition text-xs font-mono cursor-pointer mt-2">
        Commit to Database
    </button>
</form>

<script>
document.querySelector('form').addEventListener('submit', async function (e) {
  e.preventDefault(); // Stops the default page reload

  // Gather form data
  const formData = {
    student_name: document.getElementById('student_name').value,
    address: document.getElementById('address').value, // or facility_address
    start_date: document.getElementById('start_date').value,
    end_date: document.getElementById('end_date').value,
    status: 'Active',
    payment_status: 'Paid'
  };

  try {
    const response = await fetch('/api/accommodations', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(formData)
    });

    const result = await response.json();
    
    if (result.success) {
      alert('Saved successfully!');
      this.reset(); // Clear the form
    } else {
      alert('Error: ' + result.error);
    }
  } catch (err) {
    console.error('Submission failed:', err);
    alert('Network error occurred.');
  }
});
</script>
